/* Shared MASHHOOR V19 game shell */
:root{
  --bg:#050706;
  --surface:#0a0e0b;
  --surface-2:#0f1410;
  --surface-3:#151b16;
  --line:rgba(232,241,233,.105);
  --line-strong:rgba(232,241,233,.19);
  --text:#f3f6f2;
  --muted:#8d9790;
  --dim:#5d675f;
  --accent:#baff42;
  --accent-2:#74ef2b;
  --danger:#ff727d;
  --gold:#ffd36a;
  --header-h:76px;
  --radius:16px;
  --shadow:0 28px 80px rgba(0,0,0,.42);
}

html{background:var(--bg)}
body{
  background:
    radial-gradient(circle at 91% 0,rgba(122,255,50,.075),transparent 25rem),
    var(--bg);
  color:var(--text);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(#000,transparent 88%);
}
button,input,select{font-family:inherit}
button{transition:transform .18s ease,background .18s,border-color .18s,color .18s}
button:not(:disabled):active{transform:translateY(1px) scale(.99)}

header{
  height:var(--header-h);
  padding:0 clamp(16px,2.4vw,38px);
  gap:20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(5,7,6,.88);
  backdrop-filter:blur(22px) saturate(130%);
  box-shadow:0 12px 40px rgba(0,0,0,.12);
}
header .brand{gap:11px}
header .brand b{
  width:40px;
  height:40px;
  border-radius:12px;
  background:linear-gradient(145deg,#dcff93,var(--accent));
  color:#071006;
  font-size:18px;
  box-shadow:0 0 0 1px rgba(186,255,66,.22),0 12px 30px rgba(111,255,38,.08);
}
header .brand span{font-size:15px;letter-spacing:-.4px}
header .title,header .game-logo small{color:#657068;letter-spacing:2.2px}
.header-actions{gap:9px}
.home-btn,.ghost{
  border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.035);
  color:#c7cec8;
  border-radius:11px;
  padding:10px 13px;
}
.home-btn:hover,.ghost:hover{border-color:rgba(255,255,255,.23);background:rgba(255,255,255,.065);color:#fff}
.status{
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  padding:8px 11px;
}
.status::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 10%,transparent)}
.status.ok{color:#aefb82}.status.warn{color:#e3c66c}.status.bad{color:#ff8b94}

.play-surface{background:linear-gradient(155deg,rgba(255,255,255,.018),transparent 38%),#080b09}
.control-rail,.history-rail,.tool-rail{
  background:rgba(13,17,14,.92);
  border-color:rgba(255,255,255,.09);
}
.control-rail::after,.tool-rail::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.018);
}
.side-head{border-color:rgba(255,255,255,.09)}
.side-head b{letter-spacing:-.1px}
.side-head span{color:var(--accent)}

input,select{
  border-color:rgba(255,255,255,.11)!important;
  background:#080b09!important;
  color:#fff!important;
  border-radius:11px!important;
}
input:focus,select:focus{border-color:rgba(186,255,66,.44)!important;box-shadow:0 0 0 3px rgba(186,255,66,.045)}
input::placeholder{color:#5d665f}
.manual button,.choicebar button,.manual-choice button{
  border-radius:11px;
  border-color:rgba(255,255,255,.12);
}
.start,.primary{
  background:linear-gradient(145deg,#d4ff81,var(--accent));
  color:#081006;
  border-radius:12px;
  min-height:48px;
  padding-inline:24px;
  box-shadow:0 15px 34px rgba(105,255,36,.09);
}
.start:not(:disabled):hover,.primary:not(:disabled):hover{background:linear-gradient(145deg,#e1ffa5,#c6ff61);transform:translateY(-2px)}

.player-row,.player,.identity,.country-row,.log-item{border-color:rgba(255,255,255,.07)!important}
.player-row:hover,.player:hover{background:rgba(255,255,255,.025)}
.player-row i{background:var(--accent)}
.hint{color:#707a72}

.overlay{
  background:rgba(2,4,3,.86);
  backdrop-filter:blur(20px) saturate(115%);
}
.overlay.show{animation:arenaFade .22s ease}
.decision-card,.result-card{
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 0,rgba(186,255,66,.07),transparent 44%),
    #0d110e;
  box-shadow:var(--shadow);
}
.result-card{position:relative;overflow:hidden}
.result-card::after{content:"M";position:absolute;left:-35px;bottom:-92px;font:900 230px/1 Arial;color:rgba(255,255,255,.025);pointer-events:none}
.result-text{position:relative;z-index:1}
.result-text::before{color:#6a746c!important;letter-spacing:2.6px!important}
.result-text strong{color:var(--accent)!important}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#293029;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#3b443c;background-clip:padding-box}

@keyframes arenaFade{from{opacity:0}to{opacity:1}}
@keyframes arenaRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(186,255,66,.23)}50%{box-shadow:0 0 0 8px rgba(186,255,66,0)}}

@media(max-width:760px){
  :root{--header-h:68px}
  header{padding:0 10px;gap:10px}
  header .brand b{width:36px;height:36px}
  header .brand span{font-size:13px}
  .home-btn,.ghost{padding:8px 9px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* Fakkerha V19 */
:root{--quiz-gold:#ffd36a;--quiz-blue:#66a8ff;--quiz-red:#ff7180}
body{overflow-x:hidden}
#setup,#board{max-width:none}
.setup-layout{
  min-height:calc(100vh - var(--header-h));
  grid-template-columns:minmax(0,1fr) 380px;
  grid-template-areas:"main rail";
  background:#070a08;
}
.setup-main{
  padding:clamp(28px,3.2vw,52px);
  background:
    radial-gradient(circle at 24% 8%,rgba(255,211,106,.075),transparent 23rem),
    linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px),#070a08;
  background-size:auto,40px 40px,40px 40px,auto;
}
.hero{max-width:880px;margin-bottom:34px}
.hero span{
  display:inline-flex;
  padding:8px 11px;
  border:1px solid rgba(255,211,106,.16);
  border-radius:999px;
  background:rgba(255,211,106,.035);
  color:#aaa991;
}
.hero h1{font-size:clamp(52px,6vw,88px);letter-spacing:-4px;margin:13px 0 9px}
.hero em{color:var(--quiz-gold)}
.hero p{color:#8f9991}
.pickbar{
  min-height:calc(100vh - var(--header-h));
  padding:20px;
  border-right:1px solid rgba(255,255,255,.085);
  background:linear-gradient(180deg,rgba(255,211,106,.03),transparent 24%),#0c100d;
  position:relative;
}
.pickbar::before{content:"CONTROL / إعداد الجولة";color:#59635b;letter-spacing:1.7px;margin-bottom:17px}
.pick-count-label{padding:4px 2px 16px;border-color:rgba(255,255,255,.09)}
.pickbar strong{font-size:22px;color:var(--quiz-gold);direction:ltr;unicode-bidi:isolate}
.pickbar p{color:#7d877f;font-size:11px}
.pickbar button{min-height:50px;border-radius:12px;background:linear-gradient(145deg,#ffe59b,var(--quiz-gold));color:#171206;box-shadow:0 15px 34px rgba(255,211,106,.08)}

  border-radius:16px;
  background:#101310;
  overflow:hidden;
  isolation:isolate;
  box-shadow:0 14px 34px rgba(0,0,0,.13);
}
.cat::before{
  display:block;
  content:"";

  inset:0;
  z-index:-2;
  background-image:url("../../assets/fakkerha-categories-correct.png");
  background-size:400% 400%;
  background-position:var(--sprite-x) var(--sprite-y);
  filter:saturate(.88) brightness(.82);
  transform:scale(1.015);
  transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .35s;
}
.cat::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:linear-gradient(to bottom,transparent 28%,rgba(5,7,6,.12) 48%,rgba(5,7,6,.95) 100%);
}
.cat:hover{border-color:rgba(255,211,106,.38);background:#101310;transform:translateY(-3px)}

.cat .icon{display:none}

<script>window.MASHHOOR_API='https://mashhoor-secure.11im7med1.workers.dev';
window.mashNorm=(v)=>String(v??'').trim().toLowerCase();
window.mashLatinDigits=(v)=>String(v??'').replace(/[٠-٩۰-۹]/g,ch=>{const a='٠١٢٣٤٥٦٧٨٩',p='۰۱۲۳۴۵۶۷۸۹';const i=a.indexOf(ch);return String(i>=0?i:p.indexOf(ch));});
window.mashEscape=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
window.mashKickSession=()=>localStorage.getItem('mashhoor_kick_session')||'';
window.mashKickHeaders=()=>{const s=window.mashKickSession();return s?{Authorization:'Bearer '+s}:{};};
window.mashCreateKickReader=function(onMessage,onState){
  let stopped=false,cursor=Date.now()-1200,timer=null;
  async function tick(){
    if(stopped)return;
    const s=window.mashKickSession();
    if(!s){onState?.('KICK: سجّل الدخول من الرئيسية','warn');timer=setTimeout(tick,1500);return;}
    try{
      const r=await fetch(window.MASHHOOR_API+'/api/kick/chat?after='+cursor,{headers:{Authorization:'Bearer '+s},cache:'no-store'});
      if(r.status===401){onState?.('KICK: الجلسة منتهية — سجّل الدخول','bad');timer=setTimeout(tick,1800);return;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      const rows=Array.isArray(d.messages)?d.messages:[];
      for(const m of rows){
        cursor=Math.max(cursor,Number(m.at||0));
        try{await onMessage?.(m);}catch(e){console.error('Mashhoor chat handler',e)}
      }
      onState?.(rows.length?'KICK: الشات يعمل ✓':'KICK: مرتبط','ok');
    }catch(e){onState?.('KICK: تعذر قراءة الشات','bad');}
    timer=setTimeout(tick,550);
  }
  tick();
  return ()=>{stopped=true;if(timer)clearTimeout(timer)};
};

(function(){
  let lastBroadcastId='',pollTimer=null;
  function ensureBroadcastUI(){
    let el=document.getElementById('mashBroadcastOverlay');
    if(el)return el;
    el=document.createElement('div');el.id='mashBroadcastOverlay';
    el.innerHTML='<div class="mash-broadcast-shell"><div class="mash-broadcast-bar"><span><i></i> LIVE MESSAGE</span><b>MASHHOOR / SCREEN</b></div><div class="mash-broadcast-card"><button type="button" aria-label="إغلاق">×</button><div class="mash-broadcast-mark">M</div><div class="mash-broadcast-text"></div><div class="mash-broadcast-foot">رسالة من إدارة مشهور</div></div></div>';
    const css=document.createElement('style');
    css.textContent=`#mashBroadcastOverlay{display:none;position:fixed;inset:0;z-index:99999;background:rgba(3,5,4,.86);backdrop-filter:blur(18px);align-items:center;justify-content:center;padding:22px;font-family:Tahoma,Arial,sans-serif}#mashBroadcastOverlay.show{display:flex;animation:mashOverlayIn .18s ease}.mash-broadcast-shell{width:min(980px,95vw);direction:rtl}.mash-broadcast-bar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;color:#758077;font:800 9px Arial;letter-spacing:1.6px}.mash-broadcast-bar span{display:flex;align-items:center;gap:7px}.mash-broadcast-bar i{width:7px;height:7px;border-radius:50%;background:#9dff3b;box-shadow:0 0 0 5px rgba(157,255,59,.08)}.mash-broadcast-card{min-height:300px;border:1px solid #343b35;background:#0d100e;box-shadow:0 30px 100px rgba(0,0,0,.55);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:52px 58px;position:relative;overflow:hidden}.mash-broadcast-card:after{content:"M";position:absolute;left:-25px;bottom:-95px;font:900 270px Arial;color:rgba(157,255,59,.025);pointer-events:none}.mash-broadcast-card button{position:absolute;left:17px;top:16px;border:1px solid #2c322d;background:#101411;color:#8d968e;border-radius:11px;width:38px;height:38px;font-size:22px;cursor:pointer}.mash-broadcast-mark{width:48px;height:48px;border-radius:12px;background:#9dff3b;color:#071006;display:grid;place-items:center;font:900 24px Arial;margin-bottom:25px;transform:rotate(-3deg)}.mash-broadcast-text{position:relative;z-index:1;font:900 clamp(30px,5vw,64px)/1.45 Tahoma,Arial,sans-serif;color:#f5f7f4;white-space:pre-wrap;overflow-wrap:anywhere}.mash-broadcast-foot{margin-top:28px;color:#69726a;font-size:10px;font-weight:800}@keyframes mashOverlayIn{from{opacity:0;transform:scale(.99)}to{opacity:1;transform:none}}@media(max-width:600px){.mash-broadcast-card{min-height:240px;padding:48px 24px}.mash-broadcast-text{font-size:clamp(26px,9vw,42px)}}`;
    document.head.appendChild(css);document.body.appendChild(el);
    el.querySelector('button').onclick=()=>hideBroadcast();
    return el;
  }
  function hideBroadcast(){const el=document.getElementById('mashBroadcastOverlay');if(!el)return;el.classList.remove('show');clearTimeout(el._hideTimer)}
  function showBroadcast(b){
    if(!b||!b.text)return;
    const el=ensureBroadcastUI(),now=Date.now(),expires=Number(b.expires_at||0),duration=Number(b.duration_ms||8000);
    const remaining=expires?Math.max(0,Math.min(duration,expires-now)):duration;
    if(remaining<350)return;
    el.querySelector('.mash-broadcast-text').textContent=b.text;el.classList.add('show');
    clearTimeout(el._hideTimer);el._hideTimer=setTimeout(hideBroadcast,remaining);
  }
  async function pollBroadcast(){
    try{
      const r=await fetch(window.MASHHOOR_API+'/api/broadcast/current?ts='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
      if(r.ok){
        const d=await r.json(),b=d.broadcast;
        if(!b){hideBroadcast()}
        else if(b.id&&b.text&&b.id!==lastBroadcastId){lastBroadcastId=b.id;showBroadcast(b)}
      }
    }catch{}
    pollTimer=setTimeout(pollBroadcast,1200);
  }
  window.addEventListener('mashhoor:broadcast',e=>{const b=e.detail;if(b?.id){lastBroadcastId=b.id;showBroadcast(b)}});
  window.addEventListener('mashhoor:broadcast-clear',hideBroadcast);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',pollBroadcast,{once:true});else pollBroadcast();
})();

const BANK=window.MASHHOOR_QUESTION_BANK||{};
const USED_KEY='mashhoor_fakkerha_used_v2';
let usedQuestions={};
try{usedQuestions=JSON.parse(localStorage.getItem(USED_KEY)||'{}')||{}}catch{usedQuestions={}}
function fallbackQuestion(id,points,i=0){
 const pool=(BANK?.[id]||[]).filter(x=>Number(x.points)===Number(points));
 if(!pool.length)return DATA.questions?.[id]?.[i]||{points,q:'لا يوجد سؤال متاح',a:'—'};
 const key=`${id}:${points}`;let used=new Set(Array.isArray(usedQuestions[key])?usedQuestions[key]:[]);
 let available=pool.filter(x=>!used.has(x.q));
 if(!available.length){used=new Set();available=pool;usedQuestions[key]=[];}
 const q=available[Math.floor(Math.random()*available.length)];
 used.add(q.q);usedQuestions[key]=[...used];
 try{localStorage.setItem(USED_KEY,JSON.stringify(usedQuestions))}catch{}
 return q;
}
const $=id=>document.getElementById(id),esc=window.mashEscape;
let selected=[],serverBoard={},currentTeam='blue',scores={blue:0,red:0},doubleUsed={blue:false,red:false},doubleArmed={blue:false,red:false},turnStealUsed={blue:false,red:false},active=null,timer=null,timeLeft=0,stealPhase=false,answerTeam='blue';
const teamName=t=>$(t+'Name').value.trim()||(t==='blue'?'الفريق الأزرق':'الفريق الأحمر');
function renderCategories(){$('categories').innerHTML=DATA.categories.map(c=>`<button class="cat ${selected.includes(c.id)?'selected':''}" data-id="${c.id}" style="--c1:${c.c1};--c2:${c.c2}"><span class="icon">${c.icon}</span><h3>${esc(c.name)}</h3></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>toggleCategory(b.dataset.id));$('pickCount').textContent=`${selected.length} / 5`;$('startGame').disabled=selected.length!==5}
function toggleCategory(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<5)selected.push(id);renderCategories()}
async function loadConfig(){try{const r=await fetch(window.MASHHOOR_API+'/api/game-config',{cache:'no-store'});if(r.ok){const c=await r.json();if(c.fakkerhaTeamA)$('blueName').value=c.fakkerhaTeamA;if(c.fakkerhaTeamB)$('redName').value=c.fakkerhaTeamB}}catch{}update()}
async function start(){if(selected.length!==5)return;$('startGame').disabled=true;serverBoard={};$('setup').classList.remove('active');$('board').classList.add('active');buildBoard();update();const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),1800);try{const q=new URLSearchParams({categories:selected.join(',')});const r=await fetch(window.MASHHOOR_API+'/api/questions/board?'+q,{cache:'no-store',signal:controller.signal});if(r.ok){const d=await r.json();serverBoard=d.board||{}}}catch{}finally{clearTimeout(timeout)}}
function buildBoard(){const pts=[100,200,300,400,500];$('boardGrid').innerHTML=selected.map(id=>{const c=DATA.categories.find(x=>x.id===id);return `<div class="column" data-id="${id}"><div class="cat-head" data-id="${id}"><span class="icon">${c.icon}</span><b>${esc(c.name)}</b></div>${pts.map((p,i)=>`<button class="point" data-id="${id}" data-i="${i}" data-points="${p}">${p}</button>`).join('')}</div>`}).join('');document.querySelectorAll('.point').forEach(b=>b.onclick=()=>openQuestion(b))}
function update(){$('blueScore').textContent=scores.blue;$('redScore').textContent=scores.red;$('turnName').textContent=teamName(currentTeam);if($('turnSide'))$('turnSide').textContent=currentTeam==='blue'?'الفريق الأزرق':'الفريق الأحمر';if($('turnBox')){$('turnBox').classList.toggle('blue-turn',currentTeam==='blue');$('turnBox').classList.toggle('red-turn',currentTeam==='red')}['blue','red'].forEach(t=>{$(`${t}Double`).classList.toggle('used',doubleUsed[t]);$(`${t}Double`).classList.toggle('armed',doubleArmed[t]);$(`${t}TurnSteal`).classList.toggle('used',turnStealUsed[t]);$(`${t}TurnSteal`).disabled=turnStealUsed[t]||t===currentTeam})}
function armDouble(team){if(doubleUsed[team]||team!==currentTeam)return;doubleArmed[team]=!doubleArmed[team];update()}
function stealTurn(team){if(turnStealUsed[team]||team===currentTeam)return;turnStealUsed[team]=true;currentTeam=team;update()}
function openQuestion(btn){const id=btn.dataset.id,i=Number(btn.dataset.i),points=Number(btn.dataset.points),q=serverBoard?.[id]?.[points]||fallbackQuestion(id,points,i),cat=DATA.categories.find(x=>x.id===id);btn.classList.add('used');active={btn,id,q,base:q.points,mult:doubleArmed[currentTeam]?2:1,originalTeam:currentTeam};if(doubleArmed[currentTeam]){doubleUsed[currentTeam]=true;doubleArmed[currentTeam]=false}answerTeam=currentTeam;stealPhase=false;$('questionScreen').dataset.category=id;$('questionScreen').dataset.points=String(q.points);$('qCategory').textContent=cat.name;$('qPoints').textContent=(q.points*active.mult)+' نقطة';$('qText').textContent=q.q;$('aText').textContent=q.a;$('answer').classList.add('hidden');$('sourceBox').textContent=q.source?`المصدر: ${q.source}`:'';$('sourceBox').classList.add('hidden');$('stealNotice').classList.add('hidden');$('questionScreen').classList.add('show');startTimer(60);update()}
function startTimer(sec){stopTimer();timeLeft=sec;paintTimer();timer=setInterval(()=>{timeLeft--;paintTimer();if(timeLeft<=0){stopTimer();handleWrong(true)}},1000)}function stopTimer(){if(timer)clearInterval(timer);timer=null}function paintTimer(){$('timer').textContent=timeLeft;$('timer').classList.toggle('danger',timeLeft<=10)}
function showAnswer(){$('answer').classList.remove('hidden');if(active?.q?.source)$('sourceBox').classList.remove('hidden')}
function handleCorrect(){if(!active)return;stopTimer();scores[answerTeam]+=active.base*active.mult;closeQuestion(true)}
function handleWrong(fromTimer=false){if(!active)return;stopTimer();if(!stealPhase){stealPhase=true;answerTeam=currentTeam==='blue'?'red':'blue';$('stealNotice').textContent=`سرقة الإجابة لـ ${teamName(answerTeam)} — 15 ثانية`;$('stealNotice').classList.remove('hidden');$('answer').classList.add('hidden');$('sourceBox').classList.add('hidden');startTimer(15)}else{closeQuestion(false)}}
function closeQuestion(correct){stopTimer();$('questionScreen').classList.remove('show');currentTeam=active.originalTeam==='blue'?'red':'blue';active=null;stealPhase=false;update()}
function reset(){
 stopTimer();
 selected=[];serverBoard={};currentTeam='blue';scores={blue:0,red:0};
 doubleUsed={blue:false,red:false};doubleArmed={blue:false,red:false};
 turnStealUsed={blue:false,red:false};active=null;stealPhase=false;answerTeam='blue';timeLeft=0;
 $('questionScreen').classList.remove('show');$('answer').classList.add('hidden');$('sourceBox').classList.add('hidden');$('stealNotice').classList.add('hidden');
 $('boardGrid').innerHTML='';$('board').classList.remove('active');$('setup').classList.add('active');
 $('startGame').disabled=true;renderCategories();update();window.scrollTo({top:0,behavior:'smooth'});
}
$('startGame').onclick=start;$('showAnswer').onclick=showAnswer;$('correctBtn').onclick=handleCorrect;$('wrongBtn').onclick=()=>handleWrong(false);$('blueDouble').onclick=()=>armDouble('blue');$('redDouble').onclick=()=>armDouble('red');$('blueTurnSteal').onclick=()=>stealTurn('blue');$('redTurnSteal').onclick=()=>stealTurn('red');$('blueName').oninput=update;$('redName').oninput=update;$('resetGame').onclick=reset;renderCategories();loadConfig();
})();
