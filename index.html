<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050706"><meta name="description" content="مشهور — ألعاب بث عربية تفاعلية مع الغرف وكود نيمز والروليت الروسي وفكّرها."><title>مشهور | ألعاب البث التفاعلية</title><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="shortcut icon" href="./favicon.svg"><meta name="application-name" content="مشهور"><style>

:root {
  --bg: #050706;
  --panel: #0c100d;
  --panel-2: #111713;
  --line: #202821;
  --muted: #8c978e;
  --text: #f5f8f5;
  --lime: #a7ff25;
  --lime-deep: #67ba17;
  --danger: #ff4d5f;
  --cyan: #24d1ff;
}

/* Developer surface */
.developer-panel { background: radial-gradient(circle at 75% 0, rgba(168,92,255,.1), transparent 32%), #070a08; min-height: calc(100vh - 72px); padding: 28px clamp(15px,3vw,42px); }
.developer-grid { display: grid; gap: 16px; grid-template-columns: minmax(0,1.5fr) minmax(290px,.75fr); margin: 0 auto; max-width: 1220px; }
.developer-card { background: linear-gradient(145deg,#111512,#080b09); border: 1px solid #273028; border-radius: 15px; padding: 20px; }
.developer-card label { color: #929c94; display: grid; font-size: 9px; gap: 7px; margin-top: 13px; }
.developer-card input,.developer-card textarea { background: #060806; border: 1px solid #2a332b; border-radius: 9px; color: #fff; font: inherit; outline: 0; padding: 12px; resize: vertical; }
.developer-card input:focus,.developer-card textarea:focus { border-color: #a7ff25; box-shadow: 0 0 0 3px rgba(167,255,37,.06); }
.developer-card textarea { min-height: 80px; }
.developer-rules { border-top: 1px solid #202720; margin-top: 17px; padding-top: 15px; }.developer-rules > b { font-size: 10px; }.developer-rules label { align-items: center; grid-template-columns: 26px 1fr; }.developer-rules label span { align-items: center; background: rgba(167,255,37,.1); border-radius: 50%; color: var(--lime); display: flex; height: 25px; justify-content: center; }
.developer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }.developer-note { color: #657068; display: block; font-size: 8px; margin-top: 10px; }.streamer-message-card > p { color: #808a82; font-size: 10px; line-height: 1.8; }.streamer-message-card .safe-note { margin-top: 14px; }
.streamer-announcement { animation: resultPop .32s ease; background: radial-gradient(circle at 50% 0,rgba(168,92,255,.32),transparent 42%),linear-gradient(145deg,#17101f,#08090b); border: 1px solid rgba(190,118,255,.58); border-radius: 17px; box-shadow: 0 25px 90px #000,0 0 45px rgba(168,92,255,.25); left: 50%; max-width: min(560px,calc(100vw - 30px)); padding: 27px 45px; position: fixed; text-align: center; top: 50%; transform: translate(-50%,-50%); width: 100%; z-index: 90; }.streamer-announcement span { color: #cb8aff; font-size: 9px; letter-spacing: 1px; }.streamer-announcement b { display: block; font-size: 25px; margin-top: 7px; }.streamer-announcement p { color: #eef2ee; font-size: 16px; line-height: 1.8; margin: 14px 0 0; }.streamer-announcement button { background: #232027; border: 0; border-radius: 50%; color: #fff; height: 27px; position: absolute; right: 10px; top: 10px; width: 27px; }
.game-help-description { color: #89938b; font-size: 10px; line-height: 1.8; margin: 0 auto 16px; max-width: 540px; }

/* Countries war v2 */
.country-setup { align-items: center; background: radial-gradient(circle at 50% 35%,rgba(36,209,255,.13),transparent 35%),#060908; display: flex; justify-content: center; min-height: calc(100vh - 78px); padding: 20px; }.country-setup-wrapper { display: grid; gap: 30px; grid-template-columns: 1fr 280px; max-width: 1200px; width: 100%; align-items: center; }.country-setup-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }.country-setup-center .country-setup-icon { font-size: 64px; margin-bottom: 10px; }.country-setup-center h2 { font-size: 36px; margin: 0; color: var(--text); }.country-setup-center p { color: #7c8982; font-size: 11px; margin: 0; text-align: center; }.country-setup-center .setup-count { justify-content: center; margin: 15px 0; gap: 12px; }.country-setup-center .setup-count b { font-size: 28px; color: #24d1ff; }.country-setup-center .main-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; width: 100%; max-width: 300px; }.country-setup-center .button { width: 100%; }.country-setup-right { background: linear-gradient(145deg,#11191a,#080b0b); border: 1px solid #26363a; border-radius: 18px; padding: 24px; box-shadow: 0 25px 80px #000; }.country-setup-right label { display: block; color: #a9b2aa; font-size: 10px; font-weight: 800; margin-bottom: 6px; margin-top: 12px; }.country-setup-right label:first-child { margin-top: 0; }.country-setup-right textarea { background: #050706; border: 1px solid #2c3832; border-radius: 10px; color: #fff; font: inherit; line-height: 1.6; min-height: 180px; padding: 12px; resize: vertical; width: 100%; font-size: 11px; }.country-setup-right textarea:focus { border-color: #a7ff25; }.country-setup-right .setup-info { background: #080b09; border: 1px solid #283029; border-radius: 9px; padding: 10px; margin-top: 12px; text-align: center; }.country-setup-right .setup-info small { color: #707a72; font-size: 7px; display: block; }.country-setup-right .setup-info b { color: var(--lime); font-size: 16px; display: block; margin-top: 3px; }
.country-mode-tabs { background: #070a08; border: 1px solid #252d26; border-radius: 10px; display: grid; gap: 4px; grid-template-columns: 1fr 1fr; margin-bottom: 12px; padding: 4px; }.country-mode-tabs button { background: transparent; border: 0; border-radius: 7px; color: #78837b; font-size: 8px; padding: 10px 4px; }.country-mode-tabs button.active { background: #168aa3; color: #fff; }.country-tool { background: #0b0f0c; border: 1px solid #283129; border-radius: 8px; color: #a8b0aa; font-size: 8px; margin-top: 7px; padding: 10px; width: 100%; }.country-tool:disabled { opacity: .35; }.country-ranking > div.out { filter: grayscale(1); opacity: .35; }
.countries-war-v2 .country-card { appearance: none; color: #fff; cursor: pointer; text-align: right; }.countries-war-v2 .country-card:not(:disabled):hover { border-color: var(--country); box-shadow: 0 0 24px color-mix(in srgb,var(--country) 16%,transparent); transform: translateY(-2px); }.countries-war-v2 .country-card:disabled { cursor: default; }.country-state { color: var(--country); font-size: 8px; margin-inline-start: auto; }.wheel-action { min-width: 190px; }
.country-result-overlay { align-items: center; backdrop-filter: blur(8px); background: rgba(2,4,3,.72); display: flex; inset: 0; justify-content: center; padding: 20px; position: fixed; z-index: 80; }.country-result-card { animation: resultPop .35s ease; background: radial-gradient(circle at 50% 20%,rgba(255,75,74,.2),transparent 35%),linear-gradient(145deg,#171210,#070908); border: 1px solid #6b3535; border-radius: 22px; box-shadow: 0 30px 100px #000; max-width: 430px; padding: 30px; text-align: center; width: 100%; }.country-result-card > span { font-size: 58px; }.country-result-card > small { color: #ff7d75; display: block; font-size: 9px; letter-spacing: 2px; }.country-result-flag { font-size: 73px; margin: 8px 0; }.country-result-card h2 { font-size: 38px; margin: 0; font-weight: 700; }.country-result-card p { color: #929d95; margin: 8px 0 20px; font-size: 11px; }.country-result-card.winner { background: radial-gradient(circle at 50% 20%,rgba(167,255,37,.2),transparent 37%),linear-gradient(145deg,#11170d,#070908); border-color: #668f2c; }.country-result-card.winner > small { color: var(--lime); }

.country-select-modal {
  align-items: center;
  backdrop-filter: blur(12px);
  background: rgba(5, 7, 6, 0.92);
  display: flex;
  flex-direction: column;
  inset: 0;
  justify-content: center;
  padding: 30px 20px;
  position: fixed;
  z-index: 100;
}

.country-select-card {
  animation: resultPop 0.35s ease;
  background: linear-gradient(145deg, #11191a, #080b0b);
  border: 1px solid #26363a;
  border-radius: 22px;
  box-shadow: 0 40px 120px #000;
  max-width: 600px;
  padding: 40px;
  text-align: center;
  width: 100%;
}

.country-select-card h2 {
  font-size: 42px;
  margin: 0 0 20px;
  color: var(--text);
  font-weight: 700;
}

.country-select-card .select-subtitle {
  color: #8a938c;
  font-size: 12px;
  margin-bottom: 25px;
}

.country-flag-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(4, 1fr);
  margin: 20px 0;
}

.country-flag-btn {
  appearance: none;
  background: #0b0f0c;
  border: 2px solid #232b24;
  border-radius: 14px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100px;
  padding: 12px;
  transition: all 0.2s;
}

.country-flag-btn:hover {
  background: #0f1410;
  border-color: #24d1ff;
  transform: translateY(-3px);
}

.country-flag-btn span {
  font-size: 48px;
  line-height: 1;
}

.country-flag-btn b {
  font-size: 10px;
  font-weight: 600;
  color: #a8b0aa;
}

/* Five color levels */
.level-ladder { display: grid; gap: 6px; margin-top: 16px; }.level-ladder > div { align-items: center; background: #080b09; border: 1px solid #202721; border-radius: 8px; display: grid; gap: 8px; grid-template-columns: 25px 1fr; padding: 8px; }.level-ladder > div > span { align-items: center; background: #171d18; border-radius: 50%; color: #6f7971; display: flex; font-size: 8px; height: 25px; justify-content: center; }.level-ladder p,.level-ladder b,.level-ladder small { display: block; margin: 0; }.level-ladder b { font-size: 8px; }.level-ladder small { color: #667068; font-size: 6px; margin-top: 3px; }.level-ladder > div.active { border-color: #ff9e2d; }.level-ladder > div.active > span { background: #ff9e2d; color: #111; }.level-ladder > div.done > span { background: rgba(167,255,37,.15); color: var(--lime); }
.level-head { align-items: center; display: flex; gap: 10px; justify-content: center; margin-bottom: 11px; }.level-head span,.level-head i { background: #171b18; border-radius: 20px; color: #aab2ac; font-size: 7px; font-style: normal; padding: 6px 10px; }.level-head b { color: #ff9e2d; font-size: 11px; }.target-swatch { border: 3px solid rgba(255,255,255,.82); border-radius: 50%; box-shadow: 0 0 25px currentColor; height: 70px; margin: 12px auto 2px; width: 70px; }.color-instruction h2 em { color: inherit; display: block; font-size: 13px; font-style: normal; margin-top: 4px; }.color-grid.level-5 span { height: 54px; width: 72px; }

/* Mohammed pre-game setup */
.mohammed-setup { background: radial-gradient(circle at 50% 0,rgba(255,196,64,.12),transparent 34%),#070907; min-height: calc(100vh - 72px); padding: 27px clamp(14px,3vw,44px) 40px; }.mohammed-setup > header { align-items: center; display: flex; gap: 15px; margin: 0 auto 20px; max-width: 1180px; }.mohammed-setup > header > span { align-items: center; background: linear-gradient(145deg,#ffd45c,#9a6113); border-radius: 14px; color: #181006; display: flex; font-size: 28px; font-weight: 1000; height: 60px; justify-content: center; width: 60px; }.mohammed-setup header small { color: #e6b948; }.mohammed-setup header h2 { font-size: 26px; margin: 2px 0; }.mohammed-setup header p { color: #7f8981; font-size: 9px; margin: 0; }.team-setup-grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; margin: 0 auto 17px; max-width: 1180px; }.team-setup-grid label { background: #0c100d; border: 1px solid #293029; border-radius: 12px; color: #858f87; display: grid; font-size: 8px; gap: 8px; padding: 13px; }.team-setup-grid input { background: #070907; border: 1px solid #353d36; border-radius: 8px; color: #fff; font: inherit; font-size: 13px; padding: 12px; }.category-setup-head { align-items: center; display: flex; justify-content: space-between; margin: 0 auto 10px; max-width: 1180px; }.category-setup-head small,.category-setup-head b { display: block; }.category-setup-head small { color: #7b857d; font-size: 7px; }.category-setup-head b { font-size: 12px; margin-top: 3px; }.category-setup-head > span { background: #181c18; border: 1px solid #303730; border-radius: 20px; color: #8b958d; font-size: 8px; padding: 8px 13px; }.category-setup-head > span.ready { border-color: #739c38; color: var(--lime); }.category-picker { display: grid; gap: 9px; grid-template-columns: repeat(4,1fr); margin: 0 auto; max-width: 1180px; }.category-picker button { background: linear-gradient(145deg,color-mix(in srgb,var(--category) 7%,#0d100e),#080a08); border: 1px solid color-mix(in srgb,var(--category) 25%,#293029); border-radius: 11px; color: #fff; display: grid; gap: 5px; min-height: 94px; padding: 12px; place-items: center; }.category-picker button > span { color: var(--category); font-size: 22px; }.category-picker button > b { font-size: 10px; }.category-picker button > small { color: #69736b; font-size: 6px; }.category-picker button.selected { border-color: var(--category); box-shadow: inset 0 0 24px color-mix(in srgb,var(--category) 11%,transparent); transform: translateY(-2px); }.category-picker button.selected > small { color: var(--category); }.mohammed-start { display: block; margin: 22px auto 0; min-width: 230px; }

@media (max-width: 900px) {
  .developer-grid { grid-template-columns: 1fr; }
  .category-picker { grid-template-columns: repeat(2,1fr); }
  .team-setup-grid { grid-template-columns: 1fr; }
  .surface-switch button { font-size: 7px !important; padding: 8px !important; }
  .surface-switch button::after { content: none !important; }
}

@media (max-width: 560px) {
  .developer-panel,.mohammed-setup { padding-inline: 10px; }
  .category-picker { gap: 6px; }
  .category-picker button { min-height: 84px; padding: 8px; }
  .country-setup { padding: 10px; }
  .country-setup-card { padding: 21px 14px; }
  .streamer-announcement { padding-inline: 22px; }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  margin: 0;
  background:
    radial-gradient(circle at 85% 8%, rgba(91, 165, 20, 0.1), transparent 24rem),
    var(--bg);
  color: var(--text);
  font-family: Tahoma, Arial, "Segoe UI", sans-serif;
  min-width: 320px;
}

button,
input,
select {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--lime);
  color: #071000;
}

.site-shell {
  min-height: 100vh;
  overflow: hidden;
}

.topbar {
  align-items: center;
  backdrop-filter: blur(24px);
  background: rgba(5, 7, 6, 0.86);
  border-bottom: 1px solid rgba(167, 255, 37, 0.1);
  display: flex;
  gap: 36px;
  height: 82px;
  inset: 0 0 auto;
  padding: 0 clamp(18px, 5vw, 76px);
  position: fixed;
  z-index: 50;
}

.brand {
  align-items: center;
  display: flex;
  gap: 10px;
  margin-left: auto;
  min-width: max-content;
}

.brand img {
  border-radius: 50%;
  height: 50px;
  object-fit: cover;
  width: 50px;
}

.brand span {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1px;
  line-height: 1;
}

.brand small {
  color: var(--lime);
  display: block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0;
  margin-top: 5px;
}

.topbar nav {
  align-items: center;
  display: flex;
  gap: 34px;
  margin: auto;
}

.topbar nav a {
  color: #b4bcb5;
  font-size: 14px;
  font-weight: 700;
  position: relative;
}

.topbar nav a::after {
  background: var(--lime);
  border-radius: 2px;
  bottom: -12px;
  content: "";
  height: 2px;
  left: 50%;
  position: absolute;
  transform: translateX(-50%) scaleX(0);
  transition: 0.2s ease;
  width: 22px;
}

.topbar nav a:hover {
  color: #fff;
}

.topbar nav a:hover::after {
  transform: translateX(-50%) scaleX(1);
}

.top-actions,
.hero-actions,
.main-game-actions {
  align-items: center;
  display: flex;
  gap: 10px;
}

.button {
  align-items: center;
  border: 1px solid transparent;
  border-radius: 11px;
  display: inline-flex;
  font-weight: 900;
  gap: 9px;
  justify-content: center;
  min-height: 48px;
  padding: 0 20px;
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.button:hover:not(:disabled) {
  transform: translateY(-2px);
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.button.primary {
  background: linear-gradient(135deg, #b9ff42, #7bd516);
  box-shadow: 0 10px 36px rgba(126, 216, 22, 0.2);
  color: #071000;
}

.button.ghost {
  background: rgba(18, 24, 19, 0.78);
  border-color: #303a31;
  color: #f4f7f4;
}

.button.ghost:hover {
  border-color: #607162;
}

.button.kick {
  background: #53fc18;
  color: #061000;
}

.button.small {
  border-radius: 9px;
  font-size: 12px;
  min-height: 40px;
  padding: 0 15px;
}

.button.wide {
  width: 100%;
}

.live-dot {
  animation: pulse 1.6s infinite;
  background: currentColor;
  border-radius: 50%;
  display: inline-block;
  height: 7px;
  width: 7px;
}

.hero {
  align-items: center;
  display: grid;
  gap: clamp(30px, 4vw, 80px);
  grid-template-columns: 1.05fr 0.95fr;
  min-height: 760px;
  overflow: hidden;
  padding: 145px clamp(24px, 7vw, 112px) 70px;
  position: relative;
}

.hero::before {
  background-image: linear-gradient(rgba(167, 255, 37, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(167, 255, 37, 0.04) 1px, transparent 1px);
  background-size: 54px 54px;
  content: "";
  inset: 0;
  mask-image: linear-gradient(to left, black, transparent 72%);
  pointer-events: none;
  position: absolute;
}

.hero-copy,
.hero-visual {
  position: relative;
  z-index: 2;
}

.eyebrow,
.section-kicker {
  color: var(--lime);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.3px;
}

.eyebrow {
  align-items: center;
  display: flex;
  gap: 9px;
}

.eyebrow span {
  background: var(--lime);
  border-radius: 3px;
  box-shadow: 0 0 18px var(--lime);
  height: 8px;
  transform: rotate(45deg);
  width: 8px;
}

.hero h1 {
  font-size: clamp(54px, 6.8vw, 94px);
  letter-spacing: -5px;
  line-height: 1.02;
  margin: 22px 0;
}

.hero h1 em {
  color: var(--lime);
  font-style: normal;
  text-shadow: 0 0 55px rgba(167, 255, 37, 0.22);
}

.hero-copy > p {
  color: #9aa59c;
  font-size: clamp(16px, 1.6vw, 20px);
  line-height: 1.95;
  margin: 0;
  max-width: 650px;
}

.hero-actions {
  margin-top: 34px;
}

.hero-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 32px;
}

.hero-pills span {
  background: #0b100c;
  border: 1px solid #222a23;
  border-radius: 24px;
  color: #879187;
  font-size: 11px;
  padding: 9px 13px;
}

.hero-pills b {
  color: var(--lime);
  margin-left: 5px;
}

.hero-visual {
  align-items: center;
  display: flex;
  justify-content: center;
  min-height: 520px;
}

.hero-wheel {
  align-items: center;
  animation: heroFloat 5s ease-in-out infinite;
  background:
    radial-gradient(circle, #101711 0 28%, transparent 29%),
    repeating-conic-gradient(from -10deg, #99ef23 0 18deg, #172118 18deg 36deg);
  border: 18px solid #101610;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #334034, 0 0 110px rgba(167, 255, 37, 0.16), inset 0 0 45px #000;
  display: flex;
  height: min(420px, 35vw);
  justify-content: center;
  min-height: 330px;
  min-width: 330px;
  position: relative;
  width: min(420px, 35vw);
}

.hero-wheel::before {
  background: var(--lime);
  clip-path: polygon(50% 100%, 0 0, 100% 0);
  content: "";
  height: 34px;
  left: 50%;
  position: absolute;
  top: -30px;
  transform: translateX(-50%);
  width: 42px;
  z-index: 3;
}

.hero-wheel-core {
  align-items: center;
  align-self: center;
  background: #080b09;
  border: 2px solid #354036;
  border-radius: 50%;
  box-shadow: inset 0 0 30px #000;
  display: flex;
  height: 34%;
  justify-content: center;
  width: 34%;
}

.hero-wheel-core img {
  border-radius: 50%;
  height: 86%;
  width: 86%;
}

.orbit {
  border: 1px solid rgba(167, 255, 37, 0.14);
  border-radius: 50%;
  position: absolute;
}

.orbit-one {
  height: 480px;
  width: 480px;
}

.orbit-two {
  height: 590px;
  width: 590px;
}

.floating-card {
  align-items: center;
  backdrop-filter: blur(18px);
  background: rgba(14, 20, 15, 0.9);
  border: 1px solid #303b31;
  border-radius: 14px;
  box-shadow: 0 18px 55px #000a;
  display: flex;
  gap: 12px;
  padding: 13px 16px;
  position: absolute;
  z-index: 4;
}

.floating-card b,
.floating-card small {
  display: block;
}

.floating-card b {
  font-size: 13px;
}

.floating-card small {
  color: #818b82;
  font-size: 10px;
  margin-top: 5px;
}

.wheel-rotor {
  background:
    radial-gradient(circle, #0a0e0b 0 31%, transparent 31.5%),
    repeating-conic-gradient(from -18deg, #9ae824 0 18deg, #263027 18deg 36deg);
  border: 14px solid #151c16;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #3a473b, 0 0 70px rgba(167, 255, 37, 0.15), inset 0 0 35px #000;
  height: 100%;
  position: relative;
  transform: rotate(var(--rotation));
  transition: transform 2.5s cubic-bezier(0.14, 0.67, 0.04, 0.99);
  width: 100%;
}

.wheel-name {
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  left: 50%;
  position: absolute;
  top: 50%;
  transform: rotate(calc(360deg / var(--count) * var(--i))) translateY(-180px) rotate(calc(-360deg / var(--count) * var(--i)));
  transform-origin: 0 0;
  white-space: nowrap;
}

.wheel-center {
  align-items: center;
  background: #080b09;
  border: 2px solid #354136;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  height: 30%;
  justify-content: center;
  left: 35%;
  position: absolute;
  top: 35%;
  width: 30%;
}

.wheel-center img {
  border-radius: 50%;
  height: 72%;
  object-fit: cover;
  width: 72%;
}

.wheel-center small {
  color: var(--lime);
  font-size: 7px;
  transform: rotate(calc(-1 * var(--rotation)));
  transition: transform 2.5s cubic-bezier(0.14, 0.67, 0.04, 0.99);
}

.main-game-actions {
  border-top: 1px solid #252d26;
  justify-content: center;
  padding: 16px;
}

.decision-panel {
  align-items: center;
  background: rgba(167, 255, 37, 0.035);
  border-top: 1px solid rgba(167, 255, 37, 0.16);
  display: grid;
  gap: 20px;
  grid-template-columns: 0.8fr 1.2fr;
  padding: 18px 22px;
}

.decision-panel small,
.decision-panel h3,
.decision-panel p {
  display: block;
  margin: 0;
}

.decision-panel > div > small {
  color: var(--lime);
  font-size: 8px;
}

.decision-panel h3 {
  font-size: 24px;
  margin: 5px 0;
}

.decision-panel p {
  color: #79847b;
  font-size: 9px;
}

.decision-groups {
  display: grid;
  gap: 8px;
  grid-template-columns: 1fr 1fr;
}

.decision-groups > div {
  background: #080b09;
  border: 1px solid #242c25;
  border-radius: 9px;
  min-height: 80px;
  padding: 8px;
}

.decision-groups b {
  display: block;
  font-size: 8px;
  margin-bottom: 6px;
}

.decision-groups button {
  background: #191e1a;
  border: 1px solid #323b33;
  border-radius: 5px;
  color: #e8ece9;
  font-size: 8px;
  margin: 2px;
  padding: 5px 7px;
}

.decision-groups button.revive {
  border-color: rgba(167, 255, 37, 0.3);
  color: var(--lime);
}

.winner-banner {
  align-items: center;
  background: linear-gradient(90deg, rgba(167, 255, 37, 0.16), rgba(167, 255, 37, 0.03));
  border-top: 1px solid rgba(167, 255, 37, 0.3);
  display: flex;
  gap: 14px;
  padding: 18px 24px;
}

.winner-banner > span {
  color: var(--lime);
  font-size: 38px;
}

.winner-banner small,
.winner-banner b {
  display: block;
}

.winner-banner small { color: #7c867e; font-size: 8px; }
.winner-banner b { font-size: 23px; margin-top: 3px; }
.winner-banner button { background: var(--lime); border: 0; border-radius: 8px; color: #071000; font-size: 10px; font-weight: 900; margin-right: auto; padding: 10px 14px; }

.log-list {
  display: grid;
  gap: 7px;
}

.log-list p {
  align-items: center;
  background: #080b09;
  border: 1px solid #1d241e;
  border-radius: 8px;
  color: #adb5ae;
  display: flex;
  font-size: 9px;
  gap: 7px;
  line-height: 1.5;
  margin: 0;
  padding: 9px;
}

.log-list p span {
  align-items: center;
  background: #141a15;
  border-radius: 50%;
  color: var(--lime);
  display: flex;
  flex: 0 0 auto;
  font-size: 7px;
  height: 20px;
  justify-content: center;
  width: 20px;
}

.command-help {
  background: rgba(167, 255, 37, 0.04);
  border: 1px solid rgba(167, 255, 37, 0.12);
  border-radius: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 14px;
  padding: 10px;
}

.command-help b {
  color: #9da69f;
  display: block;
  font-size: 8px;
  margin-bottom: 4px;
  width: 100%;
}

.command-help code {
  font-size: 7px;
}

/* Countries */
.country-side-panel {
  order: 3;
}

.country-side-panel select {
  font-size: 11px;
  margin-bottom: 9px;
}

.country-ranking {
  display: grid;
  gap: 6px;
  margin-top: 14px;
}

.country-ranking > div {
  align-items: center;
  background: #080b09;
  border: 1px solid #1f2720;
  border-radius: 8px;
  display: grid;
  font-size: 9px;
  gap: 8px;
  grid-template-columns: 28px 1fr auto;
  padding: 10px;
  transition: 0.2s;
}

.country-ranking > div:hover {
  background: #0f1410;
  border-color: rgba(167, 255, 37, 0.2);
}

.country-ranking span { color: var(--lime); font-size: 10px; font-weight: 700; }
.country-ranking i { color: #727c74; font-size: 8px; font-style: normal; }
.country-ranking b { font-size: 11px; font-weight: 600; }

.country-arena {
  padding: 20px;
  order: 2;
  display: flex;
  flex-direction: column;
}

.arena-heading {
  align-items: center;
  display: flex;
  justify-content: center;
  flex-direction: column;
  margin-bottom: 20px;
  text-align: center;
}

.arena-heading h3 { font-size: 28px; margin: 10px 0 0; font-weight: 700; }
.arena-heading > div:last-child { background: #080b09; border: 1px solid #283029; border-radius: 10px; padding: 10px 16px; text-align: center; margin-top: 15px; }
.arena-heading small, .arena-heading b { display: block; }
.arena-heading small { color: #707a72; font-size: 8px; font-weight: 600; }
.arena-heading b { color: var(--lime); font-size: 20px; margin-top: 4px; font-weight: 700; }

.country-grid {
  display: grid;
  gap: 0;
  grid-template-columns: 1fr;
  flex: 1;
}

.country-card {
  --country: var(--lime);
  align-items: center;
  background: linear-gradient(135deg, color-mix(in srgb, var(--country) 8%, #0a0e0b), #090c0a);
  border: 1px solid color-mix(in srgb, var(--country) 25%, #222a23);
  border-radius: 12px;
  display: grid;
  gap: 12px;
  grid-template-columns: 52px 1fr auto;
  min-height: 76px;
  padding: 14px;
  position: relative;
  cursor: pointer;
  transition: all 0.2s;
}

.country-card:hover:not(:disabled) {
  background: linear-gradient(135deg, color-mix(in srgb, var(--country) 12%, #0a0e0b), #0b0e0a);
  border-color: color-mix(in srgb, var(--country) 45%, #222a23);
  transform: translateY(-2px);
}

.country-card.eliminated { filter: grayscale(1); opacity: 0.32; cursor: default; }
.country-flag { font-size: 40px; }
.country-card h4, .country-card p { margin: 0; }
.country-card h4 { font-size: 14px; font-weight: 700; }
.country-card p { color: #8a938c; font-size: 9px; margin-top: 4px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.country-lives { bottom: 9px; display: flex; gap: 3px; left: 11px; position: absolute; }
.country-lives i { color: #303831; font-size: 7px; font-style: normal; }
.country-lives i.on { color: var(--country); }
.country-score { color: var(--country); font-size: 26px; }

.battle-result {
  align-items: center;
  background: #080b09;
  border: 1px solid #263027;
  border-radius: 13px;
  display: grid;
  gap: 15px;
  grid-template-columns: 1fr auto 1fr;
  margin-top: 14px;
  padding: 11px;
}

.battle-result > div { align-items: center; display: grid; gap: 8px; grid-template-columns: auto 1fr auto; }
.battle-result > div:nth-child(3) { direction: ltr; }
.battle-result span { font-size: 28px; }
.battle-result b { color: var(--lime); font-size: 23px; }
.battle-result small { color: #8d978f; font-size: 9px; }
.battle-result em { color: var(--danger); font-size: 12px; font-style: normal; font-weight: 900; }

/* Personas */
.score-board {
  display: grid;
  gap: 6px;
}

.score-board > div {
  align-items: center;
  background: #080b09;
  border: 1px solid #202821;
  border-radius: 8px;
  display: grid;
  gap: 8px;
  grid-template-columns: 23px 1fr auto;
  padding: 9px;
}

.score-board > div.round-winner { border-color: rgba(167, 255, 37, 0.45); }
.score-board > div > span { color: #69736b; font-size: 8px; }
.score-board p, .score-board b, .score-board small { display: block; margin: 0; }
.score-board b { font-size: 10px; }
.score-board small { color: #687269; font-size: 7px; margin-top: 3px; }
.score-board i { align-items: center; background: rgba(167, 255, 37, 0.1); border-radius: 7px; color: var(--lime); display: flex; font-size: 11px; font-style: normal; height: 28px; justify-content: center; width: 28px; }

.persona-stage {
  overflow: hidden;
  padding: 25px;
  position: relative;
}

.round-pill {
  background: rgba(168, 92, 255, 0.12);
  border: 1px solid rgba(168, 92, 255, 0.3);
  border-radius: 15px;
  color: #bd83ff;
  display: inline-block;
  font-size: 9px;
  font-weight: 900;
  padding: 6px 10px;
}

.prompt-card {
  background: radial-gradient(circle at 50% 50%, rgba(168, 92, 255, 0.12), transparent 70%), #080b09;
  border: 1px solid #292333;
  border-radius: 18px;
  margin-top: 16px;
  min-height: 230px;
  padding: 34px;
  position: relative;
  text-align: center;
}

.prompt-card > span { color: rgba(168, 92, 255, 0.12); font-size: 170px; font-weight: 900; left: 30px; line-height: 1; position: absolute; top: 12px; }
.prompt-card small { color: #b474ff; font-size: 9px; font-weight: 900; }
.prompt-card h2 { font-size: clamp(25px, 3.5vw, 43px); line-height: 1.5; margin: 23px auto 12px; max-width: 700px; position: relative; }
.prompt-card p { color: #737d75; font-size: 9px; }

.vote-grid {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 14px;
}

.vote-grid button {
  align-items: center;
  background: #0a0e0b;
  border: 1px solid #252d26;
  border-radius: 10px;
  color: #fff;
  display: grid;
  gap: 7px;
  grid-template-columns: 32px 1fr auto;
  padding: 8px;
  text-align: right;
}

.vote-grid button:hover { border-color: #8751c6; }
.vote-grid button.winner { background: rgba(167, 255, 37, 0.08); border-color: var(--lime); }
.vote-grid span { align-items: center; background: linear-gradient(135deg, #a85cff, #5f2a9d); border-radius: 50%; display: flex; font-size: 10px; font-weight: 900; height: 31px; justify-content: center; width: 31px; }
.vote-grid b { font-size: 9px; }
.vote-grid small { color: #757f77; font-size: 7px; }

.persona-result {
  align-items: center;
  background: rgba(167, 255, 37, 0.08);
  border: 1px solid rgba(167, 255, 37, 0.24);
  border-radius: 10px;
  display: flex;
  gap: 10px;
  margin-top: 12px;
  padding: 10px;
}

.persona-result span { font-size: 24px; }
.persona-result p, .persona-result b { display: block; margin: 0; }
.persona-result p { color: #7d877f; font-size: 8px; }
.persona-result b { color: var(--lime); font-size: 15px; margin-top: 4px; }

.persona-help ol { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.persona-help li { align-items: center; background: #080b09; border: 1px solid #1e251f; border-radius: 8px; color: #858f87; display: flex; font-size: 9px; gap: 8px; line-height: 1.5; padding: 9px; }
.persona-help li b { align-items: center; background: rgba(168, 92, 255, 0.12); border-radius: 50%; color: #bd83ff; display: flex; flex: 0 0 auto; height: 24px; justify-content: center; width: 24px; }

/* Colors */
.color-stats,
.color-help {
  align-self: stretch;
}

.big-stat {
  background: radial-gradient(circle, rgba(255, 158, 45, 0.12), transparent 70%);
  border: 1px solid #30281e;
  border-radius: 13px;
  padding: 22px;
  text-align: center;
}

.big-stat small, .big-stat b { display: block; }
.big-stat small { color: #788279; font-size: 8px; }
.big-stat b { color: #ff9e2d; font-size: 43px; margin-top: 5px; }

.stat-pair {
  display: grid;
  gap: 7px;
  grid-template-columns: 1fr 1fr;
  margin-top: 8px;
}

.stat-pair > div { background: #080b09; border: 1px solid #202821; border-radius: 9px; padding: 12px; text-align: center; }
.stat-pair small, .stat-pair b { display: block; }
.stat-pair small { color: #687269; font-size: 7px; }
.stat-pair b { color: var(--lime); margin-top: 4px; }

.leader-mini { margin-top: 20px; }
.leader-mini > b { display: block; font-size: 9px; margin-bottom: 8px; }
.leader-mini p { align-items: center; border-bottom: 1px solid #1c231d; color: #9ca59e; display: flex; font-size: 9px; justify-content: space-between; margin: 0; padding: 9px 2px; }
.leader-mini i { color: var(--lime); font-style: normal; }

.color-stage {
  align-items: center;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: 22px;
  position: relative;
  transition: box-shadow 0.2s;
}

.color-stage.correct { box-shadow: inset 0 0 60px rgba(167, 255, 37, 0.22); }
.color-stage.wrong { box-shadow: inset 0 0 60px rgba(255, 77, 95, 0.25); }

.timer-ring {
  --progress: 360deg;
  align-items: center;
  background: conic-gradient(var(--lime) var(--progress), #1b221c 0);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  height: 78px;
  justify-content: center;
  position: relative;
  width: 78px;
}

.timer-ring::before { background: #0b0f0c; border-radius: 50%; content: ""; inset: 5px; position: absolute; }
.timer-ring span, .timer-ring small { position: relative; z-index: 1; }
.timer-ring span { font-size: 23px; font-weight: 900; }
.timer-ring small { color: #737d75; font-size: 7px; }

.color-instruction { margin: 20px 0; text-align: center; }
.color-instruction small { color: #778179; font-size: 9px; }
.color-instruction h2 { font-size: clamp(42px, 6vw, 82px); margin: 9px 0; text-shadow: 0 0 30px currentColor; }

.color-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(3, minmax(95px, 150px));
}

.color-grid button {
  --tile: var(--lime);
  align-items: center;
  background: #080b09;
  border: 1px solid #29302a;
  border-radius: 12px;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100px;
  padding: 12px;
  transition: 0.15s;
}

.color-grid button:hover { border-color: var(--tile); transform: translateY(-3px); }
.color-grid span { background: var(--tile); border-radius: 8px; box-shadow: 0 0 20px color-mix(in srgb, var(--tile) 50%, transparent); height: 38px; width: 64px; }
.color-grid b { font-size: 10px; }

.color-start-overlay {
  align-items: center;
  backdrop-filter: blur(13px);
  background: rgba(5, 7, 6, 0.82);
  display: flex;
  flex-direction: column;
  inset: 0;
  justify-content: center;
  position: absolute;
  z-index: 5;
}

.color-start-overlay > span { color: #ff9e2d; font-size: 68px; }
.color-start-overlay h3 { font-size: 25px; margin: 12px 0 22px; }

.color-help > p { color: #879188; font-size: 10px; line-height: 1.9; }
.color-help ul { display: grid; gap: 7px; list-style: none; margin: 20px 0; padding: 0; }
.color-help li { align-items: center; background: #080b09; border: 1px solid #202821; border-radius: 8px; color: #89938b; display: flex; font-size: 9px; gap: 8px; padding: 9px; }
.color-help li span { color: var(--lime); font-weight: 900; }

/* Draw */
.draw-game {
  grid-template-columns: 270px minmax(0, 1fr) 230px;
}

.draw-chat {
  display: flex;
  flex-direction: column;
}

.guess-list {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 7px;
  max-height: calc(100vh - 285px);
  min-height: 250px;
  overflow: auto;
}

.guess-list > div {
  align-items: center;
  display: grid;
  gap: 8px;
  grid-template-columns: 30px 1fr;
}

.guess-list > div > span { align-items: center; background: #202921; border-radius: 50%; color: var(--lime); display: flex; font-size: 9px; font-weight: 900; height: 29px; justify-content: center; width: 29px; }
.guess-list > div.correct { background: rgba(167, 255, 37, 0.08); border: 1px solid rgba(167, 255, 37, 0.2); border-radius: 8px; padding: 7px; }
.guess-list p, .guess-list b { display: block; margin: 0; }
.guess-list p { color: #a6afa8; font-size: 9px; }
.guess-list b { color: #6f7971; font-size: 7px; margin-bottom: 3px; }
.guess-list .correct p { color: var(--lime); }

.guess-form {
  border-top: 1px solid #232b24;
  margin-top: 12px;
  padding-top: 10px;
}

.guess-form > input { font-size: 8px; margin-bottom: 5px; padding: 8px; }
.guess-form > div { display: grid; gap: 5px; grid-template-columns: 1fr 34px; }
.guess-form > div input { font-size: 9px; padding: 10px; }
.guess-form button { background: var(--lime); border: 0; border-radius: 8px; color: #071000; font-weight: 900; }

.draw-stage {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.draw-toolbar {
  align-items: center;
  border-bottom: 1px solid #242c25;
  display: grid;
  gap: 14px;
  grid-template-columns: auto 1fr auto;
  min-height: 72px;
  padding: 10px 16px;
}

.secret-word { background: rgba(167, 255, 37, 0.08); border: 1px solid rgba(167, 255, 37, 0.2); border-radius: 9px; padding: 8px 12px; text-align: center; }
.secret-word small, .secret-word b { display: block; }
.secret-word small { color: #748076; font-size: 7px; }
.secret-word b { color: var(--lime); font-size: 16px; margin-top: 4px; }

.brushes { align-items: center; display: flex; gap: 6px; justify-content: center; }
.brushes > button:not(.tool-button) { border: 2px solid transparent; border-radius: 50%; height: 24px; width: 24px; }
.brushes > button.active:not(.tool-button) { border-color: #fff; transform: scale(1.15); }
.brushes input[type="range"] { accent-color: var(--lime); max-width: 100px; }
.tool-button { background: #171d18; border: 1px solid #303931; border-radius: 7px; color: #aeb6b0; font-size: 8px; padding: 7px 9px; }
.round-label { color: #778179; font-size: 9px; }

.draw-stage canvas {
  background: #0a0e0b;
  cursor: crosshair;
  flex: 1;
  min-height: 480px;
  touch-action: none;
  width: 100%;
}

.score-entry {
  align-items: center;
  border-bottom: 1px solid #1e251f;
  display: grid;
  font-size: 9px;
  gap: 8px;
  grid-template-columns: 20px 1fr auto;
  padding: 10px 2px;
}

.score-entry span { color: #69736b; }
.score-entry i { color: var(--lime); font-style: normal; }
.empty-state { color: #667068; font-size: 9px; line-height: 1.8; padding: 20px 4px; text-align: center; }

/* Mohammed trivia game */
.mohammed-game {
  background:
    radial-gradient(circle at 50% 0, rgba(255, 212, 59, 0.08), transparent 35%),
    #080b09;
  border: 1px solid #2a3028;
  border-radius: 16px;
  margin: 0 auto;
  max-width: 1500px;
  min-height: calc(100vh - 112px);
  overflow: hidden;
  position: relative;
}

.mohammed-scorebar {
  align-items: stretch;
  border-bottom: 1px solid #272e27;
  display: grid;
  gap: 8px;
  grid-template-columns: 1fr auto 1fr;
  padding: 14px;
}

.mohammed-team {
  align-items: center;
  background: #0d120e;
  border: 1px solid #283029;
  border-radius: 12px;
  color: #fff;
  display: grid;
  gap: 10px;
  grid-template-columns: 38px 1fr auto;
  padding: 10px 13px;
  text-align: right;
  transition: 0.2s;
}

.mohammed-team.team-2 {
  direction: ltr;
  text-align: left;
}

.mohammed-team.active {
  background: rgba(255, 212, 59, 0.08);
  border-color: rgba(255, 212, 59, 0.65);
  box-shadow: inset 0 0 24px rgba(255, 212, 59, 0.05);
}

.mohammed-team > span {
  align-items: center;
  background: linear-gradient(135deg, #ffd43b, #d99808);
  border-radius: 9px;
  color: #1c1300;
  display: flex;
  font-size: 14px;
  font-weight: 900;
  height: 36px;
  justify-content: center;
  width: 36px;
}

.mohammed-team.team-2 > span {
  background: linear-gradient(135deg, #24d1ff, #167faa);
  color: #00151d;
}

.mohammed-team input {
  background: transparent;
  border: 0;
  color: #fff;
  font-size: 13px;
  font-weight: 900;
  outline: none;
  padding: 0;
  text-align: inherit;
  width: 100%;
}

.mohammed-team small {
  color: #6f7971;
  display: block;
  font-size: 7px;
  margin-top: 5px;
}

.mohammed-team > b {
  color: #ffd43b;
  direction: ltr;
  font-size: 28px;
}

.mohammed-team.team-2 > b {
  color: #24d1ff;
}

.mohammed-round {
  align-items: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 120px;
}

.mohammed-round > span {
  align-items: center;
  background: linear-gradient(145deg, #ffe56e, #be7d04);
  border: 3px solid #40320d;
  border-radius: 50%;
  color: #171000;
  display: flex;
  font-size: 24px;
  font-weight: 1000;
  height: 48px;
  justify-content: center;
  width: 48px;
}

.mohammed-round small {
  color: #ffd43b;
  font-size: 8px;
  font-weight: 900;
  margin-top: 5px;
}

.mohammed-round b {
  color: #6f7971;
  font-size: 7px;
  margin-top: 3px;
}

.mohammed-board {
  display: grid;
  gap: 8px;
  grid-template-columns: repeat(6, 1fr);
  padding: 18px;
}

.trivia-column {
  --category: #ffd43b;
  display: grid;
  gap: 8px;
  grid-template-rows: 82px repeat(3, minmax(112px, 1fr));
}

.trivia-category {
  align-items: center;
  background: linear-gradient(145deg, color-mix(in srgb, var(--category) 15%, #0b0f0c), #0b0f0c);
  border: 1px solid color-mix(in srgb, var(--category) 38%, #222a23);
  border-radius: 11px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  justify-content: center;
  padding: 8px;
  text-align: center;
}

.trivia-category span {
  color: var(--category);
  font-size: 20px;
}

.trivia-category b {
  font-size: 10px;
}

.trivia-tile {
  align-items: center;
  background:
    linear-gradient(145deg, color-mix(in srgb, var(--category) 7%, #0d120e), #080b09);
  border: 1px solid #283029;
  border-radius: 11px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 112px;
  overflow: hidden;
  position: relative;
  transition: 0.2s ease;
}

.trivia-tile::after {
  background: var(--category);
  bottom: 0;
  content: "";
  height: 3px;
  left: 20%;
  position: absolute;
  right: 20%;
  transform: scaleX(0);
  transition: 0.2s ease;
}

.trivia-tile:hover:not(:disabled) {
  border-color: var(--category);
  box-shadow: 0 0 28px color-mix(in srgb, var(--category) 12%, transparent);
  transform: translateY(-3px);
}

.trivia-tile:hover:not(:disabled)::after {
  transform: scaleX(1);
}

.trivia-tile small,
.trivia-tile b,
.trivia-tile i {
  display: block;
}

.trivia-tile small {
  color: #69736b;
  font-size: 7px;
}

.trivia-tile b {
  color: var(--category);
  font-size: clamp(23px, 2.8vw, 39px);
  margin: 4px 0;
}

.trivia-tile i {
  color: #747e76;
  font-size: 7px;
  font-style: normal;
}

.trivia-tile.used {
  background: #070907;
  border-color: #141915;
  cursor: default;
  opacity: 0.22;
}

.trivia-tile.used b {
  color: #566058;
  text-decoration: line-through;
}

.mohammed-controls {
  align-items: center;
  background: #090d0a;
  border-top: 1px solid #252d26;
  display: grid;
  gap: 14px;
  grid-template-columns: 1fr auto auto;
  padding: 13px 18px;
}

.powerups {
  display: flex;
  gap: 7px;
}

.powerups button {
  align-items: center;
  background: #101511;
  border: 1px solid #29312a;
  border-radius: 9px;
  color: #fff;
  display: flex;
  gap: 8px;
  min-width: 130px;
  padding: 8px 10px;
  text-align: right;
}

.powerups button.armed {
  background: rgba(255, 212, 59, 0.12);
  border-color: #ffd43b;
}

.powerups button:disabled {
  cursor: not-allowed;
  opacity: 0.32;
}

.powerups button > span {
  align-items: center;
  background: rgba(255, 212, 59, 0.12);
  border-radius: 7px;
  color: #ffd43b;
  display: flex;
  font-size: 13px;
  font-weight: 900;
  height: 30px;
  justify-content: center;
  width: 30px;
}

.powerups b,
.powerups small {
  display: block;
}

.powerups b {
  font-size: 9px;
}

.powerups small {
  color: #69736b;
  font-size: 6px;
  margin-top: 3px;
}

.mohammed-status {
  min-width: 180px;
  text-align: center;
}

.mohammed-status small,
.mohammed-status b {
  display: block;
}

.mohammed-status small {
  color: #6d776f;
  font-size: 7px;
}

.mohammed-status b {
  color: #ffd43b;
  font-size: 13px;
  margin-top: 4px;
}

.mohammed-log {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 0 18px 16px;
}

.mohammed-log span {
  background: #0d120e;
  border: 1px solid #202821;
  border-radius: 16px;
  color: #7f8981;
  flex: 0 0 auto;
  font-size: 7px;
  padding: 7px 10px;
}

.question-backdrop {
  align-items: center;
  backdrop-filter: blur(15px);
  background: rgba(0, 0, 0, 0.82);
  display: flex;
  inset: 0;
  justify-content: center;
  padding: 18px;
  position: absolute;
  z-index: 15;
}

.question-card {
  --category: #ffd43b;
  background:
    radial-gradient(circle at 50% 0, color-mix(in srgb, var(--category) 15%, transparent), transparent 42%),
    #0b0f0c;
  border: 1px solid color-mix(in srgb, var(--category) 48%, #303a31);
  border-radius: 20px;
  box-shadow: 0 40px 120px #000;

  width: 100%;
}

.question-top {
  align-items: center;
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr auto auto;
  text-align: right;
}

.question-top > span {
  color: var(--category);
  font-size: 11px;
  font-weight: 900;
}

.question-top > b {
  color: var(--category);
  font-size: 13px;
}

.question-top > div {
  align-items: center;
  background: #141a15;
  border: 1px solid #303931;
  border-radius: 50%;
  display: flex;
  font-size: 17px;
  font-weight: 900;
  height: 46px;
  justify-content: center;
  width: 46px;
}

.question-top > div.danger {
  border-color: var(--danger);
  color: var(--danger);
}

.question-team {
  color: #737d75;
  display: block;
  font-size: 9px;
  margin-top: 20px;
}

.question-card h2 {
  font-size: clamp(25px, 4vw, 45px);
  line-height: 1.65;
  margin: 35px auto;
  max-width: 720px;
}

.reveal-answer {
  background: color-mix(in srgb, var(--category) 12%, #0d120e);
  border: 1px solid color-mix(in srgb, var(--category) 40%, #293129);
  border-radius: 10px;
  color: var(--category);
  font-size: 11px;
  font-weight: 900;
  padding: 13px 22px;
}

.answer-box {
  background: color-mix(in srgb, var(--category) 8%, #080b09);
  border: 1px solid color-mix(in srgb, var(--category) 28%, #252d26);
  border-radius: 13px;
  margin: 0 auto;
  max-width: 560px;
  padding: 17px;
}

.answer-box small,
.answer-box b {
  display: block;
}

.answer-box small {
  color: #6f7971;
  font-size: 8px;
}

.answer-box b {
  color: var(--category);
  font-size: 23px;
  margin-top: 7px;
}

.answer-actions {
  display: grid;
  gap: 10px;
  grid-template-columns: 1fr 1fr;
  margin-top: 28px;
}

.answer-actions button {
  border-radius: 10px;
  font-size: 11px;
  font-weight: 900;
  min-height: 46px;
}

.answer-actions .wrong {
  background: rgba(255, 77, 95, 0.09);
  border: 1px solid rgba(255, 77, 95, 0.35);
  color: #ff6474;
}

.answer-actions .correct {
  background: rgba(167, 255, 37, 0.1);
  border: 1px solid rgba(167, 255, 37, 0.38);
  color: var(--lime);
}

.skip-question {
  background: transparent;
  border: 0;
  color: #606a62;
  font-size: 8px;
  margin-top: 15px;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.2); opacity: 1; }
  50% { box-shadow: 0 0 0 5px rgba(167, 255, 37, 0.08); opacity: 0.55; }
}

@keyframes heroFloat {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-15px) rotate(2deg); }
}

/* Host control surface */
.surface-switch {
  background: #080b09;
  border: 1px solid #283029;
  border-radius: 10px;
  display: flex;
  padding: 3px;
}

.surface-switch button {
  background: transparent;
  border: 0;
  border-radius: 7px;
  color: #758078;
  font-size: 9px;
  font-weight: 900;
  padding: 8px 11px;
}

.surface-switch button.active {
  background: var(--lime);
  color: #071000;
}

.game-content.control-is-open {
  filter: blur(5px);
  opacity: 0.12;
  pointer-events: none;
}

.host-panel-wrap-hidden .host-control-panel,
.host-panel-wrap-hidden .developer-panel { display: none; }

.host-control-panel {
  background:
    radial-gradient(circle at 20% 0%, rgba(167, 255, 37, 0.09), transparent 30%),
    linear-gradient(145deg, #080b09, #050706 58%);
  bottom: 0;
  left: 0;
  overflow: auto;
  padding: 32px max(22px, calc((100vw - 1320px) / 2));
  position: fixed;
  right: 0;
  top: 78px;
  z-index: 35;
}

.control-heading {
  align-items: end;
  display: flex;
  gap: 20px;
  justify-content: space-between;
  margin-bottom: 22px;
}

.control-heading h2 { font-size: clamp(26px, 3vw, 42px); margin: 6px 0; }
.control-heading p { color: #7e8880; font-size: 11px; margin: 0; }

.control-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: 1.35fr 1fr;
}

.control-card {
  background: linear-gradient(145deg, rgba(16, 22, 17, 0.98), rgba(8, 12, 9, 0.98));
  border: 1px solid #273028;
  border-radius: 16px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
  min-height: 190px;
  padding: 18px;
}

.control-card-title {
  align-items: center;
  border-bottom: 1px solid #222a23;
  display: flex;
  font-size: 12px;
  font-weight: 900;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
}

.control-card-title > b { color: var(--lime); }
.control-live { align-items: center; display: flex; font-size: 8px; gap: 6px; }

.control-big-actions {
  display: grid;
  gap: 9px;
  grid-template-columns: repeat(3, 1fr);
}

.control-big-actions > button {
  background: #0a0f0b;
  border: 1px solid #29322a;
  border-radius: 12px;
  color: #fff;
  min-height: 126px;
  padding: 15px;
  text-align: right;
}

.control-big-actions > button:hover { border-color: rgba(167, 255, 37, 0.5); transform: translateY(-2px); }
.control-big-actions > button.danger:hover { border-color: rgba(255, 75, 91, 0.6); }
.control-big-actions span, .control-big-actions b, .control-big-actions small { display: block; }
.control-big-actions span { color: var(--lime); font-size: 25px; }
.control-big-actions button.danger span { color: #ff5c6a; }
.control-big-actions b { font-size: 10px; margin: 12px 0 5px; }
.control-big-actions small { color: #69736b; font-size: 8px; line-height: 1.6; }

.control-range { color: #838d85; display: grid; font-size: 9px; gap: 7px; }
.control-range select, .bullet-setting select, .star-setting select {
  background: #080b09;
  border: 1px solid #303831;
  border-radius: 8px;
  color: #fff;
  padding: 10px;
  width: 100%;
}

.control-toggles { display: grid; gap: 7px; margin-top: 12px; }
.control-toggles button {
  align-items: center;
  background: #090d0a;
  border: 1px solid #252d26;
  border-radius: 9px;
  color: #89938b;
  display: grid;
  font-size: 9px;
  gap: 8px;
  grid-template-columns: auto 1fr auto;
  padding: 10px;
  text-align: right;
}
.control-toggles button i { background: #3b433c; border-radius: 50%; height: 9px; width: 9px; }
.control-toggles button.on i { background: var(--lime); box-shadow: 0 0 10px rgba(167,255,37,.55); }
.control-toggles button b { color: var(--lime); font-size: 8px; }
.control-note { background: #090d0a; border: 1px solid #242c25; border-radius: 9px; color: #748078; font-size: 9px; line-height: 1.8; padding: 12px; }

.control-room-code { background: #080b09; border: 1px dashed #344035; border-radius: 11px; margin-bottom: 10px; padding: 15px; text-align: center; }
.control-room-code small, .control-room-code strong, .control-room-code span { display: block; }
.control-room-code small { color: #6e7870; font-size: 8px; }
.control-room-code strong { color: var(--lime); direction: ltr; font-size: 28px; letter-spacing: 7px; margin: 8px 0; }
.control-room-code span { color: #7e8980; font-size: 8px; }
.control-status { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.control-status span { align-items: center; background: #090d0a; border: 1px solid #242c25; border-radius: 12px; color: #7c877e; display: flex; font-size: 8px; gap: 5px; padding: 6px 9px; }
.control-status i { border-radius: 50%; height: 6px; width: 6px; }
.status-green { background: var(--lime); }.status-amber { background: #ffad33; }

.activity-control-card p { align-items: center; border-bottom: 1px solid #202721; color: #8b958d; display: grid; font-size: 9px; gap: 8px; grid-template-columns: 25px 1fr auto; margin: 0; padding: 10px 0; }
.activity-control-card p i { align-items: center; background: rgba(167,255,37,.08); border-radius: 7px; color: var(--lime); display: flex; font-style: normal; height: 25px; justify-content: center; }
.activity-control-card p small { color: #59625b; font-size: 7px; }

/* Russian roulette */
.player-remove { background: transparent; border: 0; color: #6f7871; font-size: 17px; }
.russian-main-panel { overflow: hidden; }
.bullet-counter { align-items: center; display: flex; flex-direction: column; }
.bullet-counter > span { display: flex; gap: 4px; margin-top: 5px; }
.bullet-counter i { background: #29302a; border-radius: 5px 5px 2px 2px; display: block; height: 15px; position: relative; width: 7px; }
.bullet-counter i.loaded { background: linear-gradient(#ffd96a 0 30%, #b87b1b 31%); box-shadow: 0 0 7px rgba(255,190,50,.35); }

.russian-stage {
  align-items: center;
  background: radial-gradient(circle at 50% 45%, rgba(115, 20, 27, 0.22), transparent 42%), #080a09;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 520px;
  overflow: hidden;
  padding: 26px;
  position: relative;
}

.russian-stage::before { background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 25px 25px; content: ""; inset: 0; position: absolute; }
.danger-orbit { border: 1px solid rgba(255,68,82,.1); border-radius: 50%; position: absolute; }
.danger-orbit.orbit-a { height: 410px; width: 410px; }.danger-orbit.orbit-b { height: 520px; width: 520px; }

.revolver { height: 255px; position: relative; transform-origin: 62% 50%; width: 450px; z-index: 2; }
.revolver-barrel { background: linear-gradient(#313735, #111615 52%, #262c2a); border: 2px solid #4b5350; border-radius: 18px 4px 4px 15px; box-shadow: inset 0 6px 10px #ffffff0b, 0 12px 25px #0008; height: 60px; left: 6px; position: absolute; top: 77px; width: 190px; }

@keyframes gunKick { 0% { transform: translateX(0) rotate(0); } 35% { transform: translateX(25px) rotate(5deg); } 100% { transform: translateX(0) rotate(0); } }

/* Roulette: wheel -> chosen player -> target -> six-chamber shot */
.roulette-reference {
  margin: 0 auto;
  max-width: 1180px;
  min-height: calc(100vh - 112px);
  padding: 35px 16px 28px;
}

}

  box-shadow: 0 26px 70px rgba(0, 0, 0, .32);
}

.roulette-player-chips { display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 12px 0; }
.roulette-player-chips > span { align-items: center; background: #0a0b10; border: 1px solid #282633; border-radius: 18px; display: grid; gap: 5px; grid-template-columns: 20px 1fr; min-width: 0; padding: 6px 8px; }

.roulette-ammo-line i { background: #292a31; border-radius: 4px; height: 6px; width: 100%; }.roulette-ammo-line i.loaded { background: linear-gradient(90deg, #9b23d3, #e1bb62); }

.roulette-wheel-card::before { background: radial-gradient(circle, rgba(129, 23, 185, .16), transparent 57%); content: ""; inset: 0; position: absolute; }
.reference-wheel-pointer { border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 32px solid #f1d27e; filter: drop-shadow(0 0 11px rgba(241, 210, 126, .48)); left: 50%; position: absolute; top: 23px; transform: translateX(-50%); z-index: 8; }
.reference-wheel {
  --spin-duration: 4800ms;
  --wheel-angle: 0deg;
  border: 11px solid #17171e;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(231, 202, 129, .55), 0 0 0 7px #090a0f, 0 0 65px rgba(135, 26, 193, .26), inset 0 0 50px #000;
  height: min(470px, 58vw);
  min-height: 360px;
  min-width: 360px;
  position: relative;
  transition: transform var(--spin-duration) cubic-bezier(.12, .68, .03, 1);
  width: min(470px, 58vw);
}
.reference-wheel::after { border: 2px solid rgba(232, 202, 127, .48); border-radius: 50%; content: ""; inset: 7px; pointer-events: none; position: absolute; }
.reference-wheel-label { color: white; font-size: 12px; font-weight: 900; left: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * min(190px, 23vw))); transform-origin: center; white-space: nowrap; z-index: 2; }
.reference-wheel-label b { display: block; text-shadow: 0 2px 6px #000; }.reference-wheel-label small { color: #dbc077; display: block; font-size: 7px; margin-top: 3px; text-align: center; }
.reference-wheel-center { align-items: center; background: radial-gradient(circle, #1c1b22, #08090d); border: 6px solid #15151b; border-radius: 50%; box-shadow: 0 0 0 2px rgba(227, 196, 119, .65), 0 10px 35px #000; color: #ead083; display: flex; flex-direction: column; height: 115px; justify-content: center; left: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(calc(-1 * var(--wheel-angle))); transition: transform var(--spin-duration) cubic-bezier(.12, .68, .03, 1); width: 115px; z-index: 5; }
.reference-wheel-center b { font-size: 27px; }.reference-wheel-center small { color: #777681; font-size: 7px; }

.roulette-footer-controls { align-items: center; background: rgba(11, 12, 18, .88); border: 1px solid rgba(224, 190, 112, .16); border-radius: 14px; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; padding: 11px; }
.roulette-footer-controls > div:first-child { border-inline-end: 1px solid #2a2932; padding: 0 5px 0 14px; }.roulette-footer-controls small, .roulette-footer-controls b { display: block; }.roulette-footer-controls small { color: #6f6e77; font-size: 7px; }.roulette-footer-controls b { color: #e4c575; font-size: 14px; margin-top: 3px; }
.roulette-live-status { align-items: center; color: #7d7c85; display: flex; font-size: 8px; gap: 7px; margin-inline-start: auto; }

.roulette-modal-backdrop { align-items: center; backdrop-filter: blur(14px); background: rgba(2, 3, 7, .88); display: flex; inset: 78px 0 0; justify-content: center; padding: 18px; position: fixed; z-index: 120; }
.roulette-target-card,
.roulette-gun-card,
.roulette-result-card { background: radial-gradient(circle at 50% 0, rgba(137, 29, 194, .18), transparent 42%), linear-gradient(145deg, #15151c, #090a0f); border: 1px solid #dbbd76; border-radius: 22px; box-shadow: 0 35px 110px #000; max-height: 90vh; overflow: auto; padding: 30px; text-align: center; width: min(94vw, 700px); }
.roulette-target-card > small,
.roulette-gun-card > small,
.roulette-result-card > small { color: #d7b969; font-size: 9px; }
.roulette-target-card h2,
.roulette-gun-card h2,
.roulette-result-card h2 { font-size: clamp(31px, 5vw, 52px); margin: 6px 0; }
.roulette-target-card > p,
.roulette-result-card > p { color: #92919a; font-size: 10px; line-height: 1.8; margin: 0 auto 20px; }
.roulette-target-grid { display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); margin: 19px 0; }
.roulette-target-grid button { align-items: center; background: linear-gradient(145deg, #27231e, #14131a); border: 1px solid rgba(227, 197, 124, .35); border-radius: 11px; color: white; display: grid; gap: 7px; grid-template-columns: 24px 34px 1fr; padding: 9px; text-align: right; }
.roulette-target-grid button:hover { border-color: #c685f1; transform: translateY(-2px); }
.roulette-target-grid button span { align-items: center; background: rgba(226, 193, 116, .17); border-radius: 50%; color: #e5c677; display: flex; font-size: 8px; height: 24px; justify-content: center; }
.roulette-target-grid button i { align-items: center; background: linear-gradient(135deg, #8f26c4, #43115f); border-radius: 50%; display: flex; font-style: normal; font-weight: 900; height: 34px; justify-content: center; }
.roulette-target-grid button b { font-size: 9px; }.roulette-target-grid button small { color: #777681; font-size: 7px; grid-column: 3; }

.roulette-gun-card { width: min(94vw, 830px); }
.roulette-chambers { display: flex; gap: 8px; justify-content: center; margin: 17px 0; }
.roulette-chambers i { background: #07080c; border: 2px solid #d4b86f; border-radius: 6px; height: 40px; width: 40px; }.roulette-chambers i.used { background: #27242c; opacity: .45; }.roulette-chambers i.active { box-shadow: 0 0 18px rgba(215, 185, 111, .45); }
.roulette-gun-scene { align-items: center; display: grid; grid-template-columns: minmax(0, 1.6fr) .7fr; min-height: 330px; overflow: hidden; }
.roulette-gun-card .revolver.is-cinematic { animation: gunKick 1.05s .85s ease; margin: 0 auto; transform: scale(.82); }
.target-figure { align-items: center; display: flex; flex-direction: column; min-height: 220px; position: relative; }
.target-figure > b { align-items: center; background: #16171d; border: 2px solid #d5b970; border-radius: 50%; color: white; display: flex; font-size: 22px; height: 68px; justify-content: center; position: relative; width: 68px; z-index: 2; }
.target-figure > span { background: #22232b; border-radius: 45% 45% 16% 16%; height: 115px; margin-top: 5px; width: 76px; }.target-figure > i { background: #24252c; height: 85px; position: absolute; top: 128px; width: 12px; }.target-figure::before, .target-figure::after { background: #24252c; content: ""; height: 70px; position: absolute; top: 85px; transform-origin: top; width: 10px; }.target-figure::before { right: 40px; transform: rotate(48deg); }.target-figure::after { left: 40px; transform: rotate(-48deg); }
.roulette-gun-card > p { color: #c9c7ce; font-size: 10px; margin: 0; }

.roulette-result-card { width: min(94vw, 600px); }
.roulette-result-symbol { align-items: center; background: rgba(46, 213, 120, .09); border: 1px solid rgba(46, 213, 120, .45); border-radius: 50%; color: #35e281; display: flex; font-size: 45px; height: 85px; justify-content: center; margin: 18px auto; width: 85px; }
.roulette-result-card.bang { background: radial-gradient(circle at 50% 0, rgba(216, 38, 64, .2), transparent 42%), linear-gradient(145deg, #191116, #090a0f); border-color: #e14e60; }.roulette-result-card.bang .roulette-result-symbol { background: rgba(226, 51, 78, .1); border-color: rgba(226, 51, 78, .5); color: #ff4e65; }.roulette-result-card.winner .roulette-result-symbol { background: rgba(226, 190, 91, .1); border-color: rgba(226, 190, 91, .5); color: #e8c667; }
.roulette-chat-sim { margin: 13px auto 0; max-width: 430px; }.roulette-chat-sim .chat-simulator { background: rgba(9, 10, 15, .92); border-color: rgba(224, 190, 112, .15); }

@media (max-width: 440px) {

@media (max-width: 900px) {

  .category-picker { grid-template-columns: repeat(2,1fr); }

}

@media (max-width: 560px) {

  .category-picker { gap: 6px; }
  .category-picker button { min-height: 84px; padding: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
  }
}

/* Streamer roulette and hidden developer access */

.roulette-log-card .log-list { max-height: 310px; overflow: auto; }.roulette-team-status { border-top: 1px solid #242d25; margin-top: 14px; padding-top: 12px; }.roulette-team-status > b { font-size: 9px; }.roulette-team-status p { align-items: center; background: #080b09; border: 1px solid #232c24; border-radius: 8px; display: flex; justify-content: space-between; margin: 7px 0 0; padding: 9px; }.roulette-team-status span { font-size: 8px; }.roulette-team-status span.green { color: #9cff22; }.roulette-team-status span.orange { color: #ff8b2c; }.roulette-team-status i { color: #fff; font-size: 12px; font-style: normal; font-weight: 900; }

/* Immersive Mashhoor landing */
.topbar {
  background: rgba(6,10,8,.78);
  border: 1px solid rgba(166,255,79,.15);
  border-radius: 25px;
  box-shadow: 0 18px 65px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.035);
  height: 72px;
  inset: 20px clamp(18px,4vw,64px) auto;
  padding: 0 clamp(16px,2.4vw,34px);
}
.hero {
  background:
    radial-gradient(circle at 73% 42%,rgba(114,255,63,.105),transparent 27%),
    radial-gradient(circle at 15% 76%,rgba(26,105,73,.14),transparent 30%),
    linear-gradient(150deg,#030605 0%,#07100b 54%,#030605 100%);
  gap: clamp(36px,5vw,86px);
  min-height: 100svh;
  padding: 125px clamp(24px,7vw,112px) 105px;
}
.hero::before {
  background-image: linear-gradient(rgba(168,255,88,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(168,255,88,.028) 1px,transparent 1px);
  background-size: 74px 74px;
  mask-image: linear-gradient(to bottom,black,transparent 88%);
  opacity: .65;
  z-index: 0;
}
.depth-network {
  height: 100%;
  inset: 0;
  opacity: .9;
  pointer-events: none;
  position: absolute;
  width: 100%;
  z-index: 1;
}
.hero-depth-glow {
  background: radial-gradient(circle,rgba(161,255,72,.11),transparent 61%);
  filter: blur(24px);
  height: min(760px,74vw);
  left: -18%;
  pointer-events: none;
  position: absolute;
  top: 10%;
  width: min(760px,74vw);
  z-index: 1;
}
.hero-copy,.hero-showcase-card { position: relative; z-index: 3; }
.hero-copy { max-width: 690px; }
.hero h1 { font-size: clamp(56px,6.3vw,91px); }

  backdrop-filter: blur(18px);

.hero-showcase-card {

.hero-showcase-card::before {

    const hardWords = shuffle(HARD_WORDS).slice(0, 5);
    const regularWords = shuffle(WORD_BANK.filter((word) => !hardSet.has(word))).slice(0, 20);
    const words = shuffle([...hardWords, ...regularWords]);
    const otherTeam = startingTeam === "red" ? "blue" : "red";
    const roles = shuffle([
        ...Array(9).fill(startingTeam),
        ...Array(8).fill(otherTeam),
        ...Array(7).fill("neutral"),
        "assassin",
    ]);
    return words.map((word, index) => ({ id: id(), word, role: roles[index], revealed: false }));
}

            if (!selected || selected.revealed || !current.clue || current.winner)
                return current;
            const cards = current.cards.map((item) => item.id === cardId ? { ...item, revealed: true } : item);
            const selectionLog = [...(current.turnLog ?? []), `اختار ${selectorName} بطاقة: ${selected.word}`].slice(-40);
            if (selected.role === "assassin") {
                return {

                    winner: opposite(current.activeTeam),
                    assassinLoss: true,
                    event: `بطاقة القاتل! خسر الفريق ${current.activeTeam === "red" ? "الأحمر" : "الأزرق"}`,
                    turnLog: [...selectionLog, `انتهت الجولة ببطاقة القاتل`].slice(-40),

            const redLeft = cards.some((item) => item.role === "red" && !item.revealed);

            }
